disabled_rules:
  - todo
  - trailing_comma
  - nesting

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_imports

analyzer_rules:
  - unused_import

included:
  - Sources
  - Tests

excluded:
  - .build

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 800
  error: 1000

function_body_length:
  warning: 200
  error: 300

type_body_length:
  warning: 500
  error: 700

identifier_name:
  min_length: 2
  excluded:
    - f

type_name:
  min_length: 3
